# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact-name: Linux-x86_64-artifacts
            artifact-path: target/standup-*.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact-name: Linux-arm64-artifacts
            artifact-path: target/standup-*.tar.gz
          - os: macos-latest
            arch: arm64
            artifact-name: macOS-arm64-artifacts
            artifact-path: target/standup-*.tar.gz
          - os: windows-latest
            arch: x86_64
            artifact-name: Windows-x86_64-artifacts
            artifact-path: target/standup-*.zip
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.artifact-path }}
