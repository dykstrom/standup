name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-branch:
    name: Verify tag is on master branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if tag is on master
        run: |
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          if ! git merge-base --is-ancestor $TAG_COMMIT origin/master; then
            echo "Tag is NOT on master branch"
            exit 1
          fi
          echo "Tag is on master branch"

  build:
    needs: verify-branch

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact-name: Linux-x86_64-artifacts
            artifact-path: target/standup-*.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact-name: Linux-arm64-artifacts
            artifact-path: target/standup-*.tar.gz
          - os: macos-latest
            arch: arm64
            artifact-name: macOS-arm64-artifacts
            artifact-path: target/standup-*.tar.gz
          - os: windows-latest
            arch: x86_64
            artifact-name: Windows-x86_64-artifacts
            artifact-path: target/standup-*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
